services:
  # ── Backend (Express API) ───────────────────────────────────
  # Uses the MongoDB Atlas cluster configured via MONGODB_URI in
  # backend/.env. A self-hosted Mongo container used to run alongside
  # this stack, but it was publicly exposed on 27017 with no auth and
  # got wiped by an internet ransomware bot — removed in favor of the
  # already-provisioned Atlas cluster (authenticated, not host-exposed).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heavywheels-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the Next.js bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: heavywheels-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Runtime-only (no NEXT_PUBLIC_ prefix, so it never reaches the browser
      # bundle) — Server Components fetch the backend by its Compose service
      # name over the Docker network instead of round-tripping through the
      # public IP. See SERVER_API_BASE_URL in frontend/lib/api.js for why.
      API_INTERNAL_URL: http://backend:5000/api
    depends_on:
      - backend
