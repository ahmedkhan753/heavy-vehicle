services:
  # ── Backend (Express API) ───────────────────────────────────
  # Uses the MongoDB Atlas cluster configured via MONGODB_URI in
  # backend/.env. A self-hosted Mongo container used to run alongside
  # this stack, but it was publicly exposed on 27017 with no auth and
  # got wiped by an internet ransomware bot — removed in favor of the
  # already-provisioned Atlas cluster (authenticated, not host-exposed).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heavywheels-backend
    restart: unless-stopped
    # No host port publish — only Caddy needs to reach this, over the
    # internal Compose network by service name. Exposing 5000 on the host
    # would let anyone bypass HTTPS entirely by hitting it directly.
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the Next.js bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: heavywheels-frontend
    restart: unless-stopped
    # Same reasoning as backend — Caddy reaches this over the Compose
    # network; no need (or want) to expose it on the host directly.
    expose:
      - "3000"
    environment:
      # Runtime-only (no NEXT_PUBLIC_ prefix, so it never reaches the browser
      # bundle) — Server Components fetch the backend by its Compose service
      # name over the Docker network instead of round-tripping through the
      # public IP. See SERVER_API_BASE_URL in frontend/lib/api.js for why.
      API_INTERNAL_URL: http://backend:5000/api
    depends_on:
      - backend

  # ── Caddy (TLS termination + reverse proxy) ─────────────────
  # Issues and auto-renews a free Let's Encrypt certificate for
  # heavywheelspk.com on its own — no certbot, no renewal cron. The only
  # service with a host-published port; frontend/backend are reachable
  # solely through it now.
  caddy:
    image: caddy:2-alpine
    container_name: heavywheels-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
